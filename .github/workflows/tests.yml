name: tests

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      # El cliente de Prisma es código generado, no versionado: sin esto los tests
      # no encuentran ../app/generated/prisma/client. El build de Vercel lo cubre
      # con "prisma generate && next build", pero este job nunca corre el build.
      - run: npx prisma generate
      - run: npm test
